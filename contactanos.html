<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFFIHO - Contáctanos</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="theme-transition">
    <!-- El header se cargará dinámicamente aquí -->
    
    <!-- Contenido principal -->
    <main class="main-content">
        <div class="hero-section">
            <h1 class="hero-title">Contáctanos</h1>
            <p class="hero-subtitle">
                Estamos aquí para ayudarte a encontrar la mejor solución ergonómica para tu espacio de trabajo.
            </p>
        </div>

        <div class="content-grid">
            <div class="content-card">
                <div class="card-icon">
                    <i class="fas fa-phone"></i>
                </div>
                <h3 class="card-title">Teléfono</h3>
                <p class="card-text">
                    (01) 123 4567<br>
                    Lunes a Viernes: 9:00 AM - 6:00 PM
                </p>
            </div>

            <div class="content-card">
                <div class="card-icon">
                    <i class="fas fa-envelope"></i>
                </div>
                <h3 class="card-title">Email</h3>
                <p class="card-text">
                    info@offiho.com<br>
                    ventas@offiho.com
                </p>
            </div>

            <div class="content-card">
                <div class="card-icon">
                    <i class="fas fa-map-marker-alt"></i>
                </div>
                <h3 class="card-title">Dirección</h3>
                <p class="card-text">
                    Av. Oficina 123, Lima<br>
                    Perú
                </p>
            </div>
        </div>
    </main>

    <!-- El footer se cargará dinámicamente aquí -->
    
    <!-- Script para cargar componentes -->
    <script src="js/components.js"></script>
</body>
</html>
